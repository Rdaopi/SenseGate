CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Stack sizes — default 1024 is too small for on_tx() call depth on real HW
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Detect stack overflow in debug builds
CONFIG_STACK_SENTINEL=y

# Store-and-forward buffer: 200 slots x 50 bytes = 10000 bytes RAM.
# Reduce to 20 slots (1000 bytes) for NUCLEO-L073RZ (20KB RAM total).
# Restore to 200 when using external NOR flash.

# Uncomment for real hardware (hal_hw.c). Also update CMakeLists.txt:
#   hal_sim.c  ->  hal_hw.c
# CONFIG_MODBUS=y
# CONFIG_MODBUS_MASTER=y
# CONFIG_MODBUS_SERIAL=y

# Uncomment for real hardware (hal_lora.c). Also update CMakeLists.txt:
#   hal_sim.c  ->  hal_lora.c
# CONFIG_LORA=y
# CONFIG_LORA_SX12XX=y