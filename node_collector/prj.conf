CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Stack sizes — default 1024 is too small for on_tx() call depth on real HW
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Detect stack overflow in debug builds
CONFIG_STACK_SENTINEL=y

# Keep SWD alive while the core sleeps (k_msleep) — without this the
# ST-LINK fails target examination once the firmware is running
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# Store-and-forward buffer: SF_MAX_SLOTS is reduced to 20 (1 KB) for the
# NUCLEO-L073RZ build via CMakeLists.txt (20 KB RAM total on this MCU).

# Ebyte E22-900T22S (UART transparent mode) on USART1 — see
# boards/nucleo_l073rz.overlay and src/hal_ebyte_uart.c.
# CONFIG_GPIO=y comes from the board defconfig (M0/M1/AUX pins).
# NOTE: CONFIG_LORA / CONFIG_LORA_SX12XX are NOT used: the T22S has its own
# firmware and is not a raw SPI SX1262 (that would be the E22-900M22S).

# Uncomment for a real Modbus RTU sensor (hal_hw.c). Also update CMakeLists.txt.
# CONFIG_MODBUS=y
# CONFIG_MODBUS_MASTER=y
# CONFIG_MODBUS_SERIAL=y